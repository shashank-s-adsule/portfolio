<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Deep learning neural network icon</title>
  <desc id="desc">Blue input nodes connect through a white hidden layer to red output nodes.</desc>
  <rect width="256" height="256" fill="#FFFFFF" opacity="0.07"/>

    <!-- Connections first: they remain neatly behind each node. -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Input to hidden layer -->
    <path d="M52 56H128M52 56 128 128M52 128 128 56M52 128H128M52 128 128 200M52 200 128 128M52 200H128"/>
    <!-- Hidden layer to output -->
    <path d="M128 56H204M128 56 204 128M128 128 204 56M128 128H204M128 128 204 200M128 200 204 128M128 200H204"/>
  </g>

  <g stroke="#000000" stroke-width="10">
    <!-- Input layer -->
    <circle cx="52" cy="56" r="20" fill="#1769FF"/>
    <circle cx="52" cy="128" r="20" fill="#1769FF"/>
    <circle cx="52" cy="200" r="20" fill="#1769FF"/>
    <!-- Hidden layer -->
    <circle cx="128" cy="56" r="20" fill="#FFFFFF"/>
    <circle cx="128" cy="128" r="20" fill="#FFFFFF"/>
    <circle cx="128" cy="200" r="20" fill="#FFFFFF"/>
    <!-- Output layer -->
    <circle cx="204" cy="56" r="20" fill="#f35f24"/>
    <circle cx="204" cy="128" r="20" fill="#f35f24"/>
    <circle cx="204" cy="200" r="20" fill="#f35f24"/>
  </g>
</svg>