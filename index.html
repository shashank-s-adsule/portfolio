<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 ">

    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href=".\css\root.css">
    <link rel="stylesheet" type="text/css" href=".\css\components.css">
    <link rel="stylesheet" type="text/css" href=".\css\animation.css">
    <link rel="stylesheet" type="text/css" href=".\css\style.css">

    <style>
        .typer_animation{
            font-size: 225%;
        }
        .typer_animation span{
            position: relative;
        }
        model-viewer {
            width: 100%;
            height: 50vh;
            max-width: 350px;
            margin: 0 auto;
            touch-action: manipulation;
        }
    </style>


    <title>Shashank Satish Adsule</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>

<body>
    <header>
        <a href="./index.html" class="logo">Shashank Satish Adsule</a>

        <!-- navigation bar start -->
        <nav class="navbar">
            <a href="./index.html" class="active">Home</a>
            <a href="./AboutMe.html">About</a>
            <a href="./highlights.html">Highlights</a>
            <a href="./contact.html">Contact</a>
        </nav>
        <!-- navigation bar end -->
    </header>

    <main>
        <!--first section start-->
        <section class="home" id="home">
            <div class="home-content">

                <div class="typer_animation">
                    <h4>Hi i am </h4>
                    <h2>Shashank Adsule</h2>
                    <h6>And I'm a <span id="typewriter"></span><span style="color:gold">|</span> </h6>
                </div>

                <p class="short-distription"> about my self </p>

                <!-- make it like popup to view only for my resume-->
                <a href="#" class="CV">View Resume</a>
            </div>

            <!-- 3D model start-->
            <div class="home-image">
                <model-viewer id="cube-model" src="./assets/3d models/place_holder.glb" alt="3D cube model" camera-controls></model-viewer>
            </div>
            <!-- 3D model end -->

        </section>
        <!--first section end-->

    </main>

    <!-- javascript -->
    <script src="./js/script.js"></script>
    <script>
        const modelViewer = document.getElementById('cube-model');

        // Disable zoom on scroll wheel
        modelViewer.addEventListener('wheel', (e) => {
            e.preventDefault();
        }, { passive: false });

        // Auto rotation on Y-axis
        modelViewer.addEventListener('load', () => {
            let rotationY = 0;
            setInterval(() => {
                rotationY += 0.01;
                modelViewer.model.scene.rotation.y = rotationY;
            }, 30);
        });
    </script>

</body>

</html>
